kind = "web"
previewPath = "/"
title = "Webjal Studios Portfolio"
version = "1.0.0"
id = "artifacts/webjal-studios"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22759

[services.development]
run = "pnpm --filter @workspace/webjal-studios run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/webjal-studios", "run", "build" ]
publicDir = "artifacts/webjal-studios/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22759"
BASE_PATH = "/"
